<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homewood">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#130e1b">
<title>Irene and Dani's Homewood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: tender and playful, a cozy winter night at a campus holiday market
   IDEA: a two-player pixel game save file: a campus map hiding memories, a date jar, daily quests
   PICTURE: their own pixel portrait on the title screen; a hand-drawn pixel Homewood map
   COLOUR and TYPE: night plum ground, cream plaques edged in wine, string-light gold, pine; Pixelify Sans + VT323
   LAYOUT: phone-first single column, string lights up top, bottom tab bar; full-bleed title */
:root{color-scheme:dark;--night:#130e1b;--plum:#221827;--plum2:#2f2236;--line:#4b3651;--cream:#f7e9d0;--cream2:#e9cfa6;--wine:#7a1626;--red:#c8323c;--gold:#ffc95a;--pink:#ff9fb2;--pine:#2f7a46;--ink:#f7e9d0;--mute:#c9b2a6;--px:4px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font:20px/1.18 'VT323',ui-monospace,monospace;overflow-x:clip;min-height:100dvh}
h1,h2,h3,button,.btn,.chip,.lbl,.pf,legend{font-family:'Pixelify Sans',system-ui,sans-serif}
h2{font-size:22px;line-height:1.1;margin:0 0 8px;text-wrap:balance}
h3{font-size:17px;margin:0}
p{margin:0}
[hidden]{display:none!important}
.spr{image-rendering:pixelated;display:inline-block;vertical-align:middle;flex:none}
.notch,.plaque,.card,.btn,.chip,input,textarea,select,.item,.levelup,#toast{clip-path:polygon(0 var(--px),var(--px) var(--px),var(--px) 0,calc(100% - var(--px)) 0,calc(100% - var(--px)) var(--px),100% var(--px),100% calc(100% - var(--px)),calc(100% - var(--px)) calc(100% - var(--px)),calc(100% - var(--px)) 100%,var(--px) 100%,var(--px) calc(100% - var(--px)),0 calc(100% - var(--px)))}
.plaque{background:var(--cream);color:var(--wine);border:4px solid var(--wine);box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 5px #c99a78;padding:18px}
.card{background:var(--plum);border:3px solid var(--line);padding:14px 16px}
.muted{color:var(--mute)}.plaque .muted{color:#8a5a52}
.btn{appearance:none;border:3px solid var(--wine);background:var(--cream);color:var(--wine);font-weight:600;font-size:16px;padding:9px 16px;min-height:44px;cursor:pointer;box-shadow:inset 0 -4px 0 var(--cream2);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 var(--cream2)}
.btn.red{background:var(--red);color:#fff6e6;border-color:#4e0d18;box-shadow:inset 0 -4px 0 #8e1b2a}
.btn.ghost{background:var(--plum2);color:var(--cream);border-color:var(--line);box-shadow:inset 0 -4px 0 #1b1420}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea,select{width:100%;font:20px 'VT323',monospace;background:#fff8ec;color:#2a1520;border:3px solid var(--wine);padding:8px 10px;min-height:44px;border-radius:0}
textarea{min-height:96px;resize:vertical}
input[type=file]{font-size:16px;padding:6px}
/* title: Dani's own banner and button art over the market photo */
#title{position:fixed;inset:0;z-index:5;overflow:hidden;background:#140c08}
#title .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 40%;image-rendering:pixelated}
#title::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,6,6,.65) 0%,rgba(20,6,6,.15) 40%,rgba(20,6,6,0) 55%)}
.tstack{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 5vh)}
.hcard{display:flex;flex-direction:column;align-items:center;width:min(440px,92vw)}
.hb{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 0 rgba(30,5,5,.45))}
.start{margin-top:16px;width:clamp(170px,48vw,230px);aspect-ratio:376/136;border:0;padding:0;cursor:pointer;background:url(ui/btn.webp) center/100% 100% no-repeat;filter:drop-shadow(0 5px 0 rgba(30,5,5,.45))}
.start:hover{background-image:url(ui/btn-hover.webp)}.start:active{background-image:url(ui/btn-press.webp);transform:translateY(2px)}
.start.wait{opacity:.6;cursor:progress}.start:focus-visible{outline:3px dashed #ffe7b0;outline-offset:6px}
.preload{position:absolute;width:0;height:0;overflow:hidden;background:url(ui/btn-hover.webp),url(ui/btn-press.webp)}
.memcount{margin-top:14px;font:600 17px 'Pixelify Sans';color:#fff1dc;text-align:center;text-shadow:2px 2px 0 #3a0b0b,-1px -1px 0 #3a0b0b,1px -1px 0 #3a0b0b,-1px 1px 0 #3a0b0b}
.picker{width:100%;text-align:center;margin-top:14px}
.tslot{display:flex;justify-content:center;width:100%}
.auth{text-align:left;display:grid;gap:10px}.auth h2{text-align:center;margin:0}.auth .two{margin-top:0}
.auth .err{color:#b0202c;font:600 14px 'Pixelify Sans'}.auth .ok{color:#2f7a46;font:600 14px 'Pixelify Sans'}
.linkb{background:none;border:0;color:var(--wine);font:600 14px 'Pixelify Sans';text-decoration:underline;cursor:pointer;padding:6px 0;min-height:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two .btn{min-height:56px;font-size:20px}
.taken{display:block;font:500 12px 'Pixelify Sans';opacity:.8}
@media (min-width:761px){.tstack{align-items:flex-start;justify-content:center;padding-left:max(4vw,20px)}#title .bg{object-position:58% 40%}#title::after{background:linear-gradient(90deg,rgba(20,6,6,.55) 0%,rgba(20,6,6,.2) 34%,rgba(20,6,6,0) 50%)}.hcard{width:min(500px,38vw)}}
/* app chrome */
.backdrop{position:fixed;inset:-30px;z-index:0;background:url(bg.jpg) 50% 40%/cover;filter:blur(16px) brightness(.26) saturate(1.3)}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 0 4px}
.top h1{font:700 19px 'Pixelify Sans';margin:0;color:var(--cream)}
.who{font:600 14px 'Pixelify Sans';background:var(--plum2);border:2px solid var(--line);padding:5px 9px;color:var(--gold);white-space:nowrap;text-decoration:none}
.lights{display:flex;justify-content:space-between;height:24px;margin:0 -14px 12px;padding:0 10px;background:linear-gradient(transparent 5px,#3a2b30 5px 7px,transparent 7px)}
.lights i{width:8px;height:10px;margin-top:7px;background:var(--c);box-shadow:0 0 10px 3px color-mix(in srgb,var(--c) 55%,transparent);animation:tw 2.6s steps(2) infinite}
#view{display:grid;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--plum);border-top:4px solid var(--wine);box-shadow:inset 0 3px 0 #3d2a35;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{display:grid;justify-items:center;align-content:center;gap:3px;color:var(--mute);font:600 13px 'Pixelify Sans';text-decoration:none;min-height:54px}
.tabs a.on{color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{border:2px solid var(--line);background:var(--plum2);color:var(--cream);font-weight:600;font-size:14px;padding:8px 12px;min-height:40px;white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:var(--gold);color:#2a1520;border-color:#8a5a12}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--plum);border:3px solid var(--line);padding:8px 8px 8px 12px}
.item .t{flex:1;overflow-wrap:anywhere}
.item small,.sub{display:block;color:var(--mute);font-size:17px}
.item.done .t b{text-decoration:line-through;opacity:.7}
.x{background:none;border:0;color:var(--mute);font:600 22px 'Pixelify Sans';min-width:42px;min-height:42px;cursor:pointer;flex:none}
.x.armed{color:#fff;background:var(--red);font-size:14px}
.check{width:34px;height:34px;border:3px solid var(--gold);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--gold)}
.bar{height:16px;background:#120c16;border:3px solid var(--line)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,#ffb02e 8px 16px)}
.hero{text-align:center;display:grid;justify-items:center;gap:2px}
.hero .big{font:700 clamp(68px,22vw,104px)/.95 'Pixelify Sans';color:var(--wine)}
.lbl{font-weight:600;font-size:15px}
.tick{font-size:24px}
.beat .spr{animation:beat 1.1s steps(2) infinite}
.levelup{background:var(--gold);color:#2a1520;font:700 18px 'Pixelify Sans';text-align:center;padding:10px;border:3px solid #8a5a12}
.line{display:flex;align-items:center;gap:10px}
.cd{display:flex;align-items:center;gap:12px}
.cd .n{font:700 26px 'Pixelify Sans';color:var(--gold);white-space:nowrap;text-align:right}
.cd .n small{display:block;font:500 13px 'Pixelify Sans';color:var(--mute)}
.note{display:flex;gap:12px;align-items:flex-start}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font:600 14px 'Pixelify Sans';padding:4px 9px;border:2px solid var(--line);background:var(--plum2)}
.pill.ok{background:var(--pine);border-color:#1b4a2a}
.plaque .pill{background:#f1dcbb;border-color:#c99a78}.plaque .pill.ok{background:#2f7a46;color:#fff;border-color:#1b4a2a}
.jarbox{text-align:center;display:grid;justify-items:center;gap:10px}
.jar.shake .spr{animation:shake .7s steps(7)}
.q h2{font-size:clamp(24px,6.5vw,30px);margin-top:6px}
.ans{display:grid;gap:10px}
.ans .card b{display:block;font:600 15px 'Pixelify Sans';color:var(--gold);margin-bottom:4px}
.ans .card.ir b{color:var(--pink)}
.reveal{animation:flip .5s steps(5)}
.lock{display:flex;gap:12px;align-items:center}
/* Dani's Irene map, carried over */
.mapview{display:grid;gap:12px;margin-top:14px}
.mtools{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 16px 'Pixelify Sans';color:#f2b9a6}
.hearts{display:flex;gap:2px;flex-wrap:wrap}.hearts img{width:14px;height:auto;image-rendering:pixelated}.hearts img.off{filter:grayscale(1);opacity:.4}
.kb{font:600 15px 'Pixelify Sans';min-height:44px;padding:8px 14px;color:#7d1620;background:#fbe6cb;border:3px solid #7d1620;box-shadow:inset 0 0 0 2px #e8b44a,0 3px 0 rgba(0,0,0,.35);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-align:left;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.kb:hover{background:#ffd98f}.kb:active{background:#a3212a;color:#fbe6cb}.kb.sm{min-height:40px;padding:6px 10px;font-size:14px}.kb.seen{background:#ffe7b0}
.frame{background:#7d1620;padding:4px;border:3px solid #e8b44a;outline:3px solid #7d1620;box-shadow:0 7px 0 3px rgba(0,0,0,.3);margin:3px}
.mscroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-color:#e8b44a #7d1620}
.mmap{position:relative;aspect-ratio:320/200;width:max(100%,720px);background:#2b3a2a}
.mmap canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pin{position:absolute;transform:translate(-50%,-100%);width:28px;padding:0;border:0;background:none;cursor:pointer;z-index:2}
.pin .h{display:block;animation:bob 1.1s steps(2,end) infinite}
.pin img{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 0 rgba(40,0,0,.45))}
.pin.seen .h{animation:none;transform:scale(.78)}.pin.seen img{filter:drop-shadow(0 2px 0 rgba(40,0,0,.45)) saturate(.75)}
.pin.gift{width:auto;z-index:3}.pin.gift .h{animation-delay:.55s}.pin.gift .spr{filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.pin.gift i{position:absolute;top:-7px;right:-9px;font:700 11px/1.2 'Pixelify Sans';font-style:normal;background:#c8323c;color:#fff;padding:0 3px}
.pin:focus-visible{outline:3px solid #fff}
.mtag{position:absolute;z-index:4;transform:translate(-50%,-150%);background:#fbe6cb;color:#7d1620;font:600 14px 'Pixelify Sans';border:2px solid #7d1620;box-shadow:inset 0 0 0 1px #e8b44a;padding:2px 8px;white-space:nowrap;pointer-events:none}
.scrollnote{font:600 19px 'Pixelify Sans';color:#f2b9a6}.scrollnote span{display:inline-block;animation:bob 1.1s steps(2,end) infinite}
.mbox{position:relative;min-height:180px;border:12px solid transparent;border-image:url(ui/box.webp) 150 100 80 420 fill / 54px 36px 29px 151px stretch;padding:30px 20px 22px 42px;cursor:pointer;color:#5a1a14}
.mbox h2{font:600 20px/1.3 'Pixelify Sans';margin:0 0 6px;color:#8e1b22}
.mbox p{font:18px/1.45 'Pixelify Sans';margin:0;white-space:pre-wrap}
.bx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.bx:empty{display:none}.bx .also{width:100%;font:600 14px 'Pixelify Sans';opacity:.75}
.mspots{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.mspots img{width:14px;height:auto;image-rendering:pixelated}.mspots .kb:not(.seen) img{filter:grayscale(1);opacity:.45}
@keyframes bob{50%{transform:translateY(-4px)}}
.mem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.thumb{width:68px;height:68px;object-fit:cover;border:3px solid var(--cream);display:block}
.thumb.none{display:grid;place-items:center;background:var(--plum2);border-color:var(--line)}
.photo{width:100%;max-height:340px;object-fit:cover;border:4px solid var(--wine);display:block}
.timer{text-align:center;display:grid;gap:8px;justify-items:center}
.timer .big{font:700 clamp(60px,20vw,92px)/1 'Pixelify Sans';color:var(--wine)}
.timer .bar{width:100%;border-color:#c99a78;background:#ead3ad}
.wk{display:grid;grid-template-columns:3.4em minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:18px}
.wk .bars{display:grid;gap:3px}.wk .bars i{display:block;height:9px;background:var(--gold)}.wk .bars i.ir{background:var(--pink)}
.wk .m{text-align:right;color:var(--mute);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:18px}.legend i{display:inline-block;width:12px;height:12px;background:var(--gold);margin-right:5px}.legend i.ir{background:var(--pink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:grid;gap:6px;justify-items:start;text-decoration:none;color:var(--ink)}
.tile h3{color:var(--cream)}
.icons{border:0;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap}
.icons legend{font-size:15px;color:var(--wine);margin-bottom:4px;font-weight:600}
.ic{position:relative;display:grid;place-items:center;width:48px;height:48px;border:3px solid #c99a78;cursor:pointer;background:#fff8ec}
.ic input{position:absolute;opacity:0;inset:0;cursor:pointer;min-height:0}
.ic:has(input:checked){border-color:var(--wine);background:var(--gold)}
.stackf{display:grid;gap:12px}
.f{display:grid;gap:4px;font:600 15px 'Pixelify Sans';color:var(--wine)}
.sheet{position:fixed;inset:0;z-index:20;background:#05030acc;display:flex;align-items:flex-end;justify-content:center}
.sheet-card{position:relative;width:100%;max-width:560px;max-height:90dvh;overflow:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s steps(4)}
.close{position:absolute;top:6px;right:6px;color:var(--wine)}
.warn{background:#3a1520;border-color:var(--red)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:30;background:var(--gold);color:#2a1520;font:600 15px 'Pixelify Sans';padding:10px 14px;border:3px solid #8a5a12;width:max-content;max-width:90vw;display:flex;gap:8px;align-items:center}
#lvl{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
#lvl .plaque{text-align:center;animation:pop .4s steps(4)}
#lvl .big{font:700 40px 'Pixelify Sans'}
details summary{cursor:pointer;font:600 15px 'Pixelify Sans';color:var(--mute);padding:6px 0}
@keyframes tw{50%{opacity:.35;box-shadow:none}}
@keyframes beat{50%{transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-6deg)}40%{transform:translateX(8px) rotate(6deg)}60%{transform:translateX(-6px) rotate(-4deg)}80%{transform:translateX(6px) rotate(4deg)}}
@keyframes flip{from{transform:scaleY(.1);opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
@media (min-width:600px){#app{padding-left:20px;padding-right:20px}.lights{margin:0 -20px 12px}}
</style>
</head>
<body>
<div class="backdrop" hidden></div>
<canvas id="snow" aria-hidden="true"></canvas>

<section id="title" aria-label="Title screen">
  <img class="bg" src="bg.jpg" alt="Pixel art of Dani and Irene in scarves at a Christmas market at night">
  <div class="tstack">
    <div class="hcard" id="tfoot">
      <h1 style="margin:0;width:100%"><img class="hb" src="ui/banner.webp" alt="Irene and Dani's Homewood"></h1>
      <div class="tslot" id="tslot"><button class="start" id="startBtn" aria-label="Start"></button></div>
      <p class="memcount" id="memCount">Memories hidden on campus</p>
      <span class="preload" aria-hidden="true"></span>
    </div>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <h1>Irene &amp; Dani's Homewood</h1>
    <a class="who" id="who" href="#prefs">Player</a>
  </header>
  <div class="lights" id="lights" aria-hidden="true"></div>
  <main id="view"></main>
  <section class="mapview" id="mapview" hidden aria-label="Campus map">
    <div class="mtools">
      <div class="prog"><span class="hearts" id="mhearts"></span><span id="mcount"></span></div>
      <div class="line"><button class="chip" data-act="dayNight" id="dnBtn">Day</button><button class="chip" data-act="music" id="musicBtn" aria-pressed="false"><svg viewBox="0 0 8 8" width="14" height="14" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 1h5v1H3zM3 2h1v4H3zM7 2h1v3H7zM1 5h3v2H1zM5 4h3v2H5z"/></svg> <span id="musicLbl">Music</span></button></div>
    </div>
    <div class="frame"><div class="mscroll" id="mscroll"><div class="mmap" id="mmap"><canvas id="mcv" width="320" height="200" aria-label="Pixel map of the Homewood campus"></canvas><div id="mpins"></div><div class="mtag" id="mtag" hidden></div></div></div></div>
    <p class="scrollnote">Scroll down to read the notes dummy <span aria-hidden="true">&#9660;</span></p>
    <p class="sub">Tap a heart and we'll walk there. Hover or tap any building to see its name.</p>
    <div class="mbox" id="mbox" role="status" aria-live="polite"><h2 id="bt">Hi Irene</h2><p id="bm">This is our Homewood. Tap a heart and we'll walk there together.</p><div class="bx" id="bx"></div></div>
    <button class="kb" id="mlast" hidden>Read the last note</button>
    <ul class="mspots" id="mspots"></ul>
  </section>
</div>
<audio id="bgm" src="music.mp3" loop preload="none"></audio>

<nav class="tabs" id="tabs" hidden aria-label="Sections"></nav>
<div id="sheet" class="sheet" hidden><div class="sheet-card plaque" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>
<div id="lvl" hidden></div>

<script src="firebase-config.js"></script>
<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

async function processPhoto(file){

 if(!/^image\//.test(file.type)){toast('Pick an image file');return null}
 let bmp;try{bmp=await createImageBitmap(file)}catch{toast("Couldn't read that photo");return null}
 const scale=max=>{const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c};
 if(assets){try{const c=scale(1400);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const res=await assets.upload(blob);if(res&&res.id)return {photoId:res.id}}catch{}}
 let c=scale(720),d=c.toDataURL('image/jpeg',.72);
 if(d.length>180000){c=scale(520);d=c.toDataURL('image/jpeg',.62)}
 return {photoData:d};
}

 const card=(role,a,anim)=>`<div class="card ${role==='irene'?'ir':''} ${anim?'reveal':''}"><b>${NAMES[role]}</b>${esc(a.text)}</div>`;

 else if(!oa)h+=`<div class="ans">${card(r,ma)}<div class="card lock">${spr(S.lock,4)}<p>${NAMES[o]}'s answer unlocks when they answer.</p></div></div>`;
 else{const first=!UI.revealed.includes(t);if(first){UI.revealed=[...UI.revealed.slice(-40),t];lsSet('hw-revealed',UI.revealed)}h+=`<div class="ans">${card('dani',ansOf(t,'dani'),first)}${card('irene',ansOf(t,'irene'),first)}</div>`}

{const cv=$('#snow'),cx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;let W,H,fl=[];

 const draw=()=>{cx.clearRect(0,0,W,H);for(const f of fl){if(!still){f.y+=f.v;f.d+=.01;if(f.y>H){f.y=-4;f.x=Math.random()*W}}cx.fillStyle=f.s===3?'rgba(255,255,255,.7)':'rgba(255,255,255,.45)';cx.fillRect(Math.round(f.x+Math.sin(f.d)*6),Math.round(f.y),f.s,f.s)}if(!still)requestAnimationFrame(draw)};
 size();addEventListener('resize',size);draw();if(still)addEventListener('resize',draw)}
}
</script>

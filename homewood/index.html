<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irene's Homewood</title>

<style>
/* VOICE occasion, tender: a holiday gift in Daniel's own UI kit
   IDEA a cozy visual-novel / RPG overworld of the real Homewood campus
   PICTURE autumn pixel campus with Daniel's heart pins, two walking sprites; homescreen is their market photo with his banner
   COLOUR warm cream and berry red from the kit, gold accents, holly green; night map in dark
   TYPE Pixelify Sans throughout, the kit art carries the titles
   LAYOUT banner and progress over a full-width map (scrolls sideways on phones), kit dialogue box, spot buttons */
:root{color-scheme:light dark;--bg:light-dark(#f6e4cc,#1b0f0e);--ink:light-dark(#4a1712,#f6e4cc);--soft:light-dark(#8a5a48,#c9a891);--red:#7d1620;--red2:#a3212a;--gold:#e8b44a;--cream:#fbe6cb;--card:light-dark(#fff3e3,#2a1714)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 "Pixelify Sans",ui-monospace,monospace;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(14px,2.4vw,28px) max(4vw,16px) 40px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;margin-bottom:14px}
.banner{display:block;width:min(420px,100%);height:auto;margin:0;filter:drop-shadow(0 4px 0 rgba(60,10,10,.25))}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.prog{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 10px;font-size:17px;font-weight:600;color:var(--red2)}
:root[data-theme=dark] .prog{color:#f2b9a6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .prog{color:#f2b9a6}}
#count{white-space:nowrap}
.hearts{display:flex;gap:2px}
.hearts img{width:15px;height:auto;image-rendering:pixelated}
.hearts img.off{filter:grayscale(1);opacity:.4}
.kb{font:inherit;font-weight:600;font-size:16px;min-height:44px;padding:8px 16px;color:var(--red);background:var(--cream);border:3px solid var(--red);box-shadow:inset 0 0 0 2px var(--gold),0 3px 0 rgba(60,10,10,.3);cursor:pointer;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.kb:hover{background:#ffd98f}
.kb:active{background:var(--red2);color:var(--cream)}
.kb:focus-visible{outline:3px dashed var(--red2);outline-offset:3px}
.last[hidden]{display:none}
.frame{background:var(--red);padding:4px;border:3px solid var(--gold);outline:3px solid var(--red);box-shadow:0 7px 0 3px rgba(60,10,10,.25);margin:3px}
.mscroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-color:var(--gold) var(--red)}
.map{position:relative;aspect-ratio:320/200;width:100%;background:#79b94f}
.map canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
.pin{position:absolute;transform:translate(-50%,-100%);width:3.8%;padding:0;border:0;background:none;cursor:pointer;z-index:2}
.pin .h{display:block;animation:bob 1.1s steps(2,end) infinite}
.pin img{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 0 rgba(40,0,0,.45))}
.pin.seen .h{animation:none;transform:scale(.78)}
.pin.seen img{filter:drop-shadow(0 2px 0 rgba(40,0,0,.45)) saturate(.75)}
.pin:focus-visible{outline:3px solid #fff;outline-offset:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.tag{position:absolute;z-index:3;transform:translate(-50%,-150%);background:var(--cream);color:var(--red);font-weight:600;border:2px solid var(--red);box-shadow:inset 0 0 0 1px var(--gold);padding:2px 8px;font-size:14px;white-space:nowrap;pointer-events:none}
.tag[hidden]{display:none}
.scrollnote{margin:14px 0 0;font-size:clamp(18px,2vw,22px);font-weight:600;color:var(--red2)}
.scrollnote span{display:inline-block;animation:bob 1.1s steps(2,end) infinite}
:root[data-theme=dark] .scrollnote{color:#f2b9a6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .scrollnote{color:#f2b9a6}}
.hint{margin:4px 0 0;font-size:14px;color:var(--soft)}
.box{position:relative;margin:16px 0 0;min-height:200px;border:12px solid transparent;border-image:url(ui/box.webp) 150 100 80 420 fill / 75px 50px 40px 210px stretch;padding:42px 34px 24px 60px;cursor:pointer;color:#5a1a14}
.box h2{font:600 clamp(18px,2vw,22px)/1.3 "Pixelify Sans",monospace;margin:0 0 6px;color:#8e1b22}
.box p{margin:0;font-size:clamp(17px,1.9vw,20px);max-width:66ch}
.spots{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.spots button{display:flex;align-items:center;gap:8px}
.spots img{width:14px;height:auto;image-rendering:pixelated}
.spots button:not(.seen) img{filter:grayscale(1);opacity:.45}
.spots button.seen{background:#ffe7b0}
.home{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 max(4vw,20px);overflow:hidden;background:#140c08;transition:opacity .5s steps(5)}
.home.gone{opacity:0;pointer-events:none}
.home[hidden]{display:none}
.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 40%;image-rendering:crisp-edges;image-rendering:pixelated}
.hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,6,6,.55) 0%,rgba(20,6,6,.2) 34%,rgba(20,6,6,0) 50%)}

.start{margin-top:clamp(12px,2vw,22px);width:clamp(170px,15vw,230px);aspect-ratio:376/136;border:0;padding:0;cursor:pointer;background:url(ui/btn.webp) center/100% 100% no-repeat;filter:drop-shadow(0 5px 0 rgba(30,5,5,.45))}
.start:hover{background-image:url(ui/btn-hover.webp)}
.start:active{background-image:url(ui/btn-press.webp);transform:translateY(2px)}
.start:focus-visible{outline:3px dashed #ffe7b0;outline-offset:6px}
.hprog{margin-top:14px;font-size:16px;font-weight:600;color:#fff1dc;text-shadow:2px 2px 0 #3a0b0b,-1px -1px 0 #3a0b0b,1px -1px 0 #3a0b0b,-1px 1px 0 #3a0b0b}
.music{position:fixed;right:max(16px,2vw);bottom:max(16px,2vw);z-index:15;display:flex;align-items:center;gap:8px}
.music[hidden]{display:none}
.music svg{width:16px;height:16px}
.music[aria-pressed=false]{opacity:.7;text-decoration:line-through}
.preload{position:absolute;width:0;height:0;overflow:hidden;background:url(ui/btn-hover.webp),url(ui/btn-press.webp)}
@media (prefers-reduced-motion:reduce){.pin .h,.scrollnote span{animation:none}.home{transition:none}}
@media (max-width:760px){.home{align-items:flex-end;justify-content:center;padding:0 0 5vh}.hbg{object-position:52% 40%}.hshade{background:linear-gradient(0deg,rgba(20,6,6,.6) 0%,rgba(20,6,6,.15) 40%,rgba(20,6,6,0) 55%)}.hcard{width:min(440px,92vw)}}
@media (max-width:720px){.map{width:720px}.pin{width:28px}}
@media (max-width:600px){header{flex-direction:column;align-items:flex-start}.side{align-items:flex-start}.prog{justify-content:flex-start}.box{border-image:url(ui/box.webp) 150 100 80 420 fill / 54px 36px 29px 151px stretch;padding:30px 20px 22px 42px;min-height:180px}}
</style>
</head>

    const y=Math.round(c.y),x=c.x;D(x,y,3,c.len,c.c);
    const front=c.dir>0?y+c.len-2:y+1,rear=c.dir>0?y+1:y+c.len-2;
    D(x,front,3,1,'#9fc3d8');D(x,rear,3,1,'#6f8fa3');
    if(c.bus){D(x+1,y+2,1,c.len-4,'#ffffff')}
    if(night){D(x,c.dir>0?y+c.len:y-1,1,1,LAMP);D(x+2,c.dir>0?y+c.len:y-1,1,1,LAMP)}
  }else{
    const x=Math.round(c.x),y=c.y;D(x,y,c.len,2,c.c);D(c.dir>0?x+c.len-2:x+1,y,1,2,'#9fc3d8');
    if(night)D(c.dir>0?x+c.len:x-1,y,1,1,LAMP);
  }
}
function moveCar(c,dt){
  if(c.ax==='v'){c.y+=c.dir*c.v*dt;if(c.dir>0&&c.y>H+4)c.y=-14;if(c.dir<0&&c.y<-14)c.y=H+4}
  else if(c.y>100){c.x+=c.dir*c.v*dt;if(c.x<272)c.x=W+4}
  else{c.x+=c.dir*c.v*dt;if(c.x<-10)c.x=W+4;if(c.x>W+4)c.x=-10}
}
const keys=Object.keys(N).filter(k=>!['chw157','e157','village','chw1','chw76','ccn','cc','wol','mcc'].includes(k));
const SHIRTS=['#e8b64a','#7a4fbf','#2e8b57','#f2f2f2','#d94141','#3fa7c9','#f08a5d'];
const npcs=[];
for(let i=0;i<9;i++){const a=keys[(rnd()*keys.length)|0];const opts=NB[a].filter(k=>keys.includes(k));npcs.push({a,b:opts[(rnd()*opts.length)|0],p:rnd(),v:9+rnd()*5,c:SHIRTS[i%7],hr:rnd()<.5?'#2b2018':'#6b4a2f'})}
function moveNpc(n,dt){
  n.p+=n.v*dt/Math.max(1,dist(n.a,n.b));
  if(n.p>=1){const back=n.a;n.a=n.b;n.p=0;let o=NB[n.a].filter(k=>keys.includes(k)&&k!==back);if(!o.length)o=[back];n.b=o[(Math.random()*o.length)|0]}
}
function drawNpc(n,fr){
  const x=Math.round(N[n.a][0]+(N[n.b][0]-N[n.a][0])*n.p)+(n.c.length%2),y=Math.round(N[n.a][1]+(N[n.b][1]-N[n.a][1])*n.p);
  D(x-1,y-5,2,1,n.hr);D(x-1,y-4,2,1,'#f0c49c');D(x-2,y-3,4,2,n.c);D(x-1,y-1,1,1,'#3a3f55');D(x+(fr?0:1),y-1,1,1,'#3a3f55');
}

let cur='kq',route=[],pending=null,frame=0,ft=0,floatT=0,last=0;
const pos={x:N.kq[0],y:N.kq[1]};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(t){
  ctx.clearRect(0,0,W,H);ctx.drawImage(bg,0,0);
  cars.forEach(drawCar);
  const nf=Math.floor(t/260)%2;npcs.forEach(n=>drawNpc(n,nf));
  const fx=Math.round(pos.x),fy=Math.round(pos.y)+1;
  D(fx-7,fy,13,1,'rgba(0,0,0,.28)');
  spr(fx-7,fy-8,BOY,frame);spr(fx,fy-8,GIRL,frame?0:1);
  if(floatT){const k=(t-floatT)/900;if(k<1)cheart(fx-4,fy-17-Math.round(k*8));else floatT=0}
}
function tick(t){
  const dt=Math.min(.05,(t-(last||t))/1000);last=t;
  cars.forEach(c=>moveCar(c,dt));npcs.forEach(n=>moveNpc(n,dt));
  if(route.length){
    const [wx,wy]=N[route[0]],dx=wx-pos.x,dy=wy-pos.y,d=Math.hypot(dx,dy),step=58*dt;
    if(d<=step){pos.x=wx;pos.y=wy;cur=route.shift();
      if(pending){route=shortest(cur,pending.node).slice(1);pending=null}
      if(!route.length)arrive(t)}
    else{pos.x+=dx/d*step;pos.y+=dy/d*step}
    ft+=dt;if(ft>.13){ft=0;frame=frame?0:1}
  }else frame=0;
  render(t);
  requestAnimationFrame(tick);
}

// UI
const bt=document.getElementById('bt'),bm=document.getElementById('bm'),box=document.getElementById('box');
let tw=0,full='';
function say(t,m){
  bt.textContent=t;full=m;clearInterval(tw);
  if(reduce){bm.textContent=m;return}
  let i=0;bm.textContent='';
  tw=setInterval(()=>{i+=2;bm.textContent=m.slice(0,i);if(i>=m.length)clearInterval(tw)},28);
}
box.addEventListener('click',()=>{clearInterval(tw);bm.textContent=full||bm.textContent});

const visited=new Set();
const heartSVG=(fill,shine,shade)=>{
  const path=dy=>HR.map((r,y)=>[...r].map((c,x)=>c==='X'?`M${x} ${y+dy}h1v1h-1z`:'').join('')).join('');
  return `<svg viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true">${shade?`<path d="${path(1)}" fill="${shade}"/>`:''}<path d="${path(0)}" fill="${fill}"/>${shine?`<path d="M1 1h1v1h-1z" fill="${shine}"/>`:''}</svg>`;
};
const map=document.getElementById('map'),spotsEl=document.getElementById('spots'),scroller=document.getElementById('scroller'),tag=document.getElementById('tag');
map.insertAdjacentHTML('beforeend',SPOTS.map(s=>`<button class="pin" id="pin-${s.id}" style="left:${s.x/W*100}%;top:${s.y/H*100}%" aria-label="${s.name}" title="${s.name}"><span class="h"><img src="ui/heart.webp" alt=""></span></button>`).join(''));
function ui(){
  SPOTS.forEach(s=>document.getElementById('pin-'+s.id).classList.toggle('seen',visited.has(s.id)));
  spotsEl.innerHTML=SPOTS.map(s=>`<li><button class="kb ${visited.has(s.id)?'seen':''}" data-id="${s.id}"><img src="ui/heart.webp" alt="">${s.name}</button></li>`).join('');
  document.getElementById('hearts').innerHTML=SPOTS.map(s=>`<img src="ui/heart.webp" alt="" class="${visited.has(s.id)?'':'off'}">`).join('');
  const n=visited.size;
  document.getElementById('count').textContent=n===SPOTS.length?`All ${SPOTS.length} found`:`${n} of ${SPOTS.length} found`;
  document.getElementById('last').hidden=n<SPOTS.length;
}
function save(){try{localStorage.setItem('irene-homewood',JSON.stringify([...visited]))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('irene-homewood')||'[]')}catch(e){return[]}}
function centerOn(x,smooth){if(scroller.scrollWidth>scroller.clientWidth)scroller.scrollTo({left:x/W*map.clientWidth-scroller.clientWidth/2,behavior:smooth&&!reduce?'smooth':'auto'})}

let dest=null;
function go(target){
  dest=target;centerOn(N[target.node][0],true);
  if(reduce){cur=target.node;pos.x=N[cur][0];pos.y=N[cur][1];route=[];arrive(0);render(0);return}
  if(route.length)pending=target;
  else{route=shortest(cur,target.node).slice(1);if(!route.length){arrive(performance.now());return}}
  bt.textContent=target.name;full='Walking over...';clearInterval(tw);bm.textContent=full;
}
function arrive(t){
  const s=dest;if(!s)return;
  if(s.id){visited.add(s.id);save();ui()}
  say(s.t,s.m);floatT=reduce?0:t;
}
map.addEventListener('click',e=>{const p=e.target.closest('.pin');if(p)go(SPOTS.find(s=>'pin-'+s.id===p.id))});
spotsEl.addEventListener('click',e=>{const p=e.target.closest('button');if(p)go(SPOTS.find(s=>s.id===p.dataset.id))});
document.getElementById('last').addEventListener('click',()=>go({node:'kq',t:FINAL.t,m:FINAL.m,name:'Back to the start'}));

// building names
let tagTimer=0;
function showTag(e){
  if(e.target.closest('.pin')){tag.hidden=true;return}
  const r=map.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;
  const hit=BLD.find(o=>lx>=o.x&&lx<o.x+o.w&&ly>=o.y-(o.t==='gilman'?30:3)&&ly<o.y+o.h&&(o.t!=='gilman'||ly>=o.y||Math.abs(lx-(o.x+o.w/2))<7))||AREAS.find(o=>lx>=o.x&&lx<o.x+o.w&&ly>=o.y&&ly<o.y+o.h);
  if(!hit){tag.hidden=true;return}
  tag.textContent=hit.n;tag.hidden=false;tag.style.left=Math.min(92,Math.max(8,lx/W*100))+'%';tag.style.top=(ly/H*100)+'%';
}
map.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')showTag(e)});
map.addEventListener('pointerleave',()=>{tag.hidden=true});
map.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){showTag(e);clearTimeout(tagTimer);tagTimer=setTimeout(()=>tag.hidden=true,1800)}});


// homescreen
const PHOTO='bg.jpg';
const home=document.getElementById('home'),hcv=document.getElementById('hcv'),hphoto=document.getElementById('hphoto');
if(PHOTO){hphoto.src=PHOTO;hphoto.hidden=false;hcv.hidden=true}
const drawHome=()=>{hcv.getContext('2d').drawImage(bg,0,0)};
const hprog=()=>{const n=visited.size;document.getElementById('hprog').textContent=n?(n===SPOTS.length?`All ${n} memories found`:`${n} of ${SPOTS.length} memories found`):`${SPOTS.length} memories hidden on campus`};
document.body.style.overflow='hidden';
document.getElementById('startBtn').addEventListener('click',()=>{home.classList.add('gone');document.body.style.overflow='';setTimeout(()=>{home.hidden=true},reduce?0:520)});

// music
const bgm=document.getElementById('bgm'),mBtn=document.getElementById('musicBtn'),mLbl=document.getElementById('musicLbl');
let musicOn=true;try{musicOn=localStorage.getItem('irene-homewood-music')!=='off'}catch(e){}
let fadeT=0;
function fadeTo(v,ms){clearInterval(fadeT);const from=bgm.volume,t0=performance.now();fadeT=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);bgm.volume=from+(v-from)*k;if(k>=1){clearInterval(fadeT);if(v===0)bgm.pause()}},50)}
function setMusic(on){
  musicOn=on;mBtn.setAttribute('aria-pressed',on);mLbl.textContent=on?'Music on':'Music off';
  try{localStorage.setItem('irene-homewood-music',on?'on':'off')}catch(e){}
  if(on){bgm.volume=0;const pr=bgm.play();if(pr)pr.catch(()=>{});fadeTo(.55,2200)}else fadeTo(0,500);
}
mBtn.addEventListener('click',()=>setMusic(!musicOn));
bgm.addEventListener('error',()=>{musicOn=false;mBtn.remove()});
document.getElementById('startBtn').addEventListener('click',()=>{mBtn.hidden=false;if(musicOn)setMusic(true);else setMusic(false)});
// theme
const mq=matchMedia('(prefers-color-scheme: dark)');
const setPal=()=>{const th=document.documentElement.dataset.theme;P=(th?th==='dark':mq.matches)?DARK:LIGHT;drawStatic();drawHome();render(performance.now())};
mq.addEventListener('change',setPal);
const themeObs=new MutationObserver(setPal);themeObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

window.claude?.hot?.snapshot?.(()=>({visited:[...visited]}));
const start=d=>{((d&&d.visited)||load()).forEach(id=>{if(SPOTS.some(s=>s.id===id))visited.add(id)});save();ui();setPal();hprog();centerOn(N.kq[0],false);if(!reduce)requestAnimationFrame(tick)};
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>

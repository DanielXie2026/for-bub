<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for Irene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: tender, quiet, a little nervous. Written at midnight.
   IDEA: a real sealed envelope with a handwritten letter, rough draft and all.
   PICTURE: the envelope, large, with a wax seal you break to open it.
   COLOUR and TYPE: deep wine night, blush paper envelope, crimson seal, blue-black ink. Caveat handwriting, Karla for the small stuff.
   LAYOUT: one centred object; the letter opens over everything as a full sheet of paper. */
:root{
  --bg:#2b0f1c;--bg2:#4a1a30;--env:#efc4ca;--env2:#e2a9b2;--env3:#c98692;
  --paper:#fbf5f2;--ink:#1f2443;--seal:#a8162f;--blush:#ffd9df;--muted:#e8b9c2;
  color-scheme:dark
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 35%,var(--bg2),var(--bg) 70%);color:var(--blush);
  font:16px/1.55 Karla,system-ui,sans-serif;overflow-x:clip;min-height:100svh;display:grid;place-items:center}
main{display:grid;justify-items:center;gap:clamp(18px,4vh,34px);padding:clamp(28px,6vh,64px) 16px;text-align:center}
h1{font:600 clamp(36px,7vw,52px)/1.05 Caveat,cursive;margin:0;color:var(--blush);text-wrap:balance}
.hint{margin:0;font-size:15px;color:var(--muted);min-height:24px;transition:opacity .4s}

/* envelope */
.env{position:relative;width:min(86vw,440px);aspect-ratio:3/2;perspective:1200px;
  filter:drop-shadow(0 26px 30px rgba(0,0,0,.45)) drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.back{position:absolute;inset:0;background:var(--env3);border-radius:8px}
.peek{position:absolute;left:7%;right:7%;top:7%;height:86%;background:var(--paper);border-radius:4px;z-index:2;
  background-image:repeating-linear-gradient(transparent 0 17px,rgba(31,36,67,.09) 17px 18px);
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1) .7s}
.pocket{position:absolute;inset:0;z-index:3;border-radius:8px;
  background:linear-gradient(160deg,var(--env),var(--env2));
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.pocket::before,.pocket::after{content:"";position:absolute;bottom:0;width:50%;height:100%}
.pocket::before{left:0;background:linear-gradient(to top right,transparent calc(50% - 1px),rgba(120,40,60,.16) 50%,transparent calc(50% + 2px))}
.pocket::after{right:0;background:linear-gradient(to top left,transparent calc(50% - 1px),rgba(120,40,60,.16) 50%,transparent calc(50% + 2px))}
.to{position:absolute;left:0;right:0;bottom:11%;z-index:4;font:600 clamp(28px,6vw,38px)/1 Caveat,cursive;color:var(--ink);opacity:.82;pointer-events:none}
.flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:5;transform-origin:top center;
  background:linear-gradient(180deg,var(--env2),var(--env));clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
.flap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 30%)}
.seal{position:absolute;left:50%;top:62%;z-index:6;width:68px;height:68px;margin:-34px 0 0 -34px;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 34% 30%,#e0546a,var(--seal) 55%,#650a1c);color:#ffd2da;
  font:600 34px/1 Caveat,cursive;padding-top:4px;
  box-shadow:0 0 0 5px rgba(168,22,47,.55),0 0 0 9px rgba(168,22,47,.18),0 6px 14px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.3);
  transition:transform .45s ease,opacity .45s ease;animation:pulse 2.4s ease-in-out infinite}
.seal::after{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px dashed rgba(255,210,218,.45)}
.seal:focus-visible{outline:3px solid var(--blush);outline-offset:8px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.env.open .seal{animation:none;transform:scale(.2) rotate(40deg);opacity:0;pointer-events:none}
.env.open .flap{transform:rotateX(180deg)}
.env.behind .flap{z-index:1}
.env.open .peek{transform:translateY(-46%)}

/* the letter */
.read{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;
  background:rgba(22,6,13,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .6s ease}
.read.on{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(100%,560px);max-height:calc(100svh - 32px);overflow:auto;border-radius:6px;
  background-color:var(--paper);color:var(--ink);padding:clamp(26px,6vw,52px) clamp(22px,6vw,52px) 28px;text-align:left;
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(31,36,67,.08) 35px 36px);background-attachment:local;
  background-position:0 clamp(26px,6vw,52px);
  font:400 clamp(22px,4.6vw,26px)/36px Caveat,cursive;
  box-shadow:0 30px 60px rgba(0,0,0,.5);transform:translateY(40px) scale(.96);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.read.on .paper{transform:none}
.l{margin:0;min-height:36px;opacity:0;transform:translateY(6px);transition:opacity 1.4s ease,transform 1.4s ease}
.l.in{opacity:1;transform:none}
.l.gap{min-height:22px}
.s{position:relative;transition:color .9s}
.s::after{content:"";position:absolute;left:-3px;top:54%;height:2px;width:0;background:var(--seal);border-radius:2px;transition:width 1s ease}
.l.struck .s{color:rgba(31,36,67,.45)}
.l.struck .s::after{width:calc(100% + 6px)}
.quit.struck .s::after{transition-duration:.45s}
.quit.fixed{opacity:.4;transition:opacity 1.6s ease}
.t{opacity:0;transition:opacity 1.4s ease}
.l.fixed .t{opacity:1}
.smudge span{display:inline-block;user-select:none;-webkit-user-select:none;transition:filter 3s ease,opacity 3s ease,letter-spacing 3s ease,transform 3s ease}
.smudge.smeared span{filter:blur(5px);opacity:.45;letter-spacing:.08em;transform:translateX(4px) skewX(-6deg)}
.sig{text-align:right;font-weight:600}
.time{text-align:right;font-size:.8em;opacity:.6}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:22px;opacity:0;transition:opacity .6s}
.acts.in{opacity:1}
.acts button{font:600 15px/1 Karla,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer;
  border:1.5px solid rgba(31,36,67,.25);background:transparent;color:var(--ink)}
.acts button.main{background:var(--seal);border-color:var(--seal);color:#fff}
.acts button:focus-visible{outline:3px solid var(--seal);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main>
  <h1>You've got a letter.</h1>
  <div class="env" id="env">
    <div class="back"></div>
    <div class="peek"></div>
    <div class="pocket"></div>
    <div class="to">for Irene</div>
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="Break the seal and open the letter">I</button>
  </div>
  <p class="hint" id="hint">tap the seal to open it</p>
</main>

<div class="read" id="read" role="dialog" aria-modal="true" aria-label="Letter for Irene">
  <article class="paper" id="paper">
    <div id="poem"></div>
    <div class="acts" id="acts">
      <button id="again">Read it again</button>
      <button class="main" id="fold">Fold it back up</button>
    </div>
  </article>
</div>

<script>
{
  /* ---- Edit the letter here ----
     A plain string is one line. "" is a pause between stanzas.
     {s:"...", t:"..."} draws a line through s, then writes t after it, like a rough draft. */
  /* {s:"...", t:""} crosses a line out and leaves it, unfinished.
     {smudge:"..."} writes a line, then lets the ink smear until it can't be read. */
  const lines = [
    "Irene,",
    "",
    {s:"I have something to tell you.", t:"I have something I keep."},
    "It's very small. It fits",
    "between two fingers, curled.",
    "",
    "I think you gave it to me once,",
    "or I gave it to you.",
    {s:"I know it happened.", t:"I think it happened."},
    "Some nights it's as real as your hand.",
    "Some nights I wonder if I dreamed it in your voice.",
    "",
    {s:"Do you remember when we", t:""},
    "",
    "So I carry it the way you'd carry",
    "something that might be glass.",
    {s:"I could just ask you.", t:"I don't ask."},
    "If it was never there,",
    "I don't want to watch it disappear.",
    "",
    "And here's the part that doesn't make sense:",
    "I love you past where words go,",
    "so even small things land loud,",
    "like a pebble in a shoe",
    "I'd still walk anywhere in.",
    {s:"It shouldn't bother me.", t:"It bothers me because it's you."},
    "",
    "So if I go quiet sometimes,",
    {s:"it's nothing.", t:"it isn't distance."},
    "It's me holding something small and maybe real,",
    {s:"waiting for the right time,", t:"waiting until I'm brave,"},
    "and loving you the whole time I wait.",
    "",
    {smudge:"I hope you remember it too."},
    "",
    {sig:"— Daniel"},
    {time:"12:02 a.m."}
  ];

  const esc = x => x.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const poem = document.getElementById('poem');
  poem.innerHTML = lines.map(x => {
    if (x === "") return '<p class="l gap" aria-hidden="true"></p>';
    if (typeof x === "string") return '<p class="l">' + esc(x) + '</p>';
    if (x.s && !x.t) return '<p class="l draft quit"><span class="s">' + esc(x.s) + '</span></p>';
    if (x.s) return '<p class="l draft"><span class="s">' + esc(x.s) + '</span> <span class="t">' + esc(x.t) + '</span></p>';
    if (x.smudge) return '<p class="l smudge"><span>' + esc(x.smudge) + '</span></p>';
    if (x.sig) return '<p class="l sig">' + esc(x.sig) + '</p>';
    return '<p class="l time">' + esc(x.time) + '</p>';
  }).join('');

  const env = document.getElementById('env');
  const seal = document.getElementById('seal');
  const hint = document.getElementById('hint');
  const read = document.getElementById('read');
  const paper = document.getElementById('paper');
  const acts = document.getElementById('acts');
  const ps = [...poem.querySelectorAll('.l')];
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };

  const reset = () => {
    ps.forEach(p => p.classList.remove('in', 'struck', 'fixed', 'smeared'));
    acts.classList.remove('in');
    paper.scrollTop = 0;
  };

  const play = () => {
    clear(); reset();
    if (still) {
      ps.forEach(p => p.classList.add('in', 'struck', 'fixed', 'smeared'));
      acts.classList.add('in');
      return;
    }
    let t = 900;
    ps.forEach(p => {
      later(() => {
        p.classList.add('in');
        if (p.offsetTop + p.offsetHeight > paper.scrollTop + paper.clientHeight - 60)
          paper.scrollTo({top: p.offsetTop - paper.clientHeight * 0.5, behavior: 'smooth'});
      }, t);
      if (p.classList.contains('quit')) {
        later(() => p.classList.add('struck'), t + 1500);
        later(() => p.classList.add('fixed'), t + 2600);
        t += 3800;
      } else if (p.classList.contains('draft')) {
        later(() => p.classList.add('struck'), t + 1900);
        later(() => p.classList.add('fixed'), t + 3200);
        t += 4800;
      } else if (p.classList.contains('smudge')) {
        later(() => p.classList.add('smeared'), t + 2600);
        t += 5000;
      } else {
        t += p.classList.contains('gap') ? 1000 : 2000;
      }
    });
    later(() => acts.classList.add('in'), t + 800);
  };

  const open = () => {
    env.classList.add('open');
    hint.style.opacity = 0;
    if (still) { env.classList.add('behind'); read.classList.add('on'); play(); document.getElementById('fold').focus(); return; }
    later(() => env.classList.add('behind'), 520);
    later(() => { read.classList.add('on'); play(); }, 2300);
  };

  const fold = () => {
    clear();
    read.classList.remove('on');
    const shut = () => {
      reset();
      env.classList.remove('behind');
      env.classList.remove('open');
      hint.textContent = 'sealed again, for whenever you want to reread it';
      hint.style.opacity = 1;
      seal.focus();
    };
    still ? shut() : later(shut, 500);
  };

  seal.addEventListener('click', open);
  document.getElementById('again').addEventListener('click', play);
  document.getElementById('fold').addEventListener('click', fold);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && read.classList.contains('on')) fold(); });
}
</script>
</body>
</html>
